
name: DevOps Pipeline Success Indicator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run application
        run: python app.py

      - name: Run automated tests
        id: tests
        run: python -m unittest discover -s tests -v

      - name: Send pipeline status to AWS
        if: always()
        env:
          AWS_API_URL: ${{ secrets.AWS_API_URL }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_RESULT" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILURE"
          fi

          curl -X POST "$AWS_API_URL" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"$STATUS\"}"
